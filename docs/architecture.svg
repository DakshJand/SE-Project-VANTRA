<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#0d1117"/>
  <text x="490" y="34" fill="#58a6ff" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="3">VANTRA</text>
  <text x="490" y="54" fill="#8b949e" font-size="12" font-style="italic" text-anchor="middle">One vehicle, one trail, across every camera in the city.</text>

  <!-- Camera pipeline -->
  <rect x="30" y="90" width="200" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="130" y="112" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">CAMERA PIPELINE</text>
  <text x="130" y="134" fill="#8b949e" font-size="11" text-anchor="middle">simulated ingestion</text>
  <text x="130" y="156" fill="#8b949e" font-size="11" text-anchor="middle">POST /api/ingest/simulate</text>
  <text x="130" y="182" fill="#58a6ff" font-size="11" text-anchor="middle">plate localization</text>
  <text x="130" y="200" fill="#58a6ff" font-size="11" text-anchor="middle">OCR text + confidence</text>
  <text x="130" y="218" fill="#58a6ff" font-size="11" text-anchor="middle">Re-ID embedding</text>

  <!-- Signals -->
  <rect x="300" y="90" width="200" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="400" y="112" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">SIGNALS (ML)</text>
  <text x="400" y="140" fill="#d29922" font-size="11" text-anchor="middle">plate string + OCR conf</text>
  <text x="400" y="162" fill="#d29922" font-size="11" text-anchor="middle">appearance cosine sim</text>
  <text x="400" y="184" fill="#d29922" font-size="11" text-anchor="middle">learned travel-time pct</text>
  <text x="400" y="206" fill="#d29922" font-size="11" text-anchor="middle">type / color agreement</text>

  <!-- Decision layer -->
  <rect x="570" y="70" width="380" height="200" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="760" y="94" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">EXPLICIT DECISION LAYER — tiered matcher</text>
  <text x="600" y="122" fill="#3fb950" font-size="11">1. exact plate + route-plausible edge</text>
  <text x="600" y="142" fill="#58a6ff" font-size="11">2. fuzzy plate (OCR-conf-aware threshold), unique edge</text>
  <text x="600" y="162" fill="#bc8cff" font-size="11">3. fuzzy, multiple candidates → appearance tie-break</text>
  <text x="600" y="180" fill="#d29922" font-size="11">    (ambiguous ties NOT forced — human review)</text>
  <text x="600" y="200" fill="#d29922" font-size="11">4. plate unreadable → appearance + route only</text>
  <text x="600" y="224" fill="#f85149" font-size="11">min_time floor violated → HARD anomaly (spoof/cloned)</text>
  <text x="600" y="246" fill="#8b949e" font-size="11">never-zero decay, stop-eligible edges wider, 2-hop window</text>

  <!-- Storage -->
  <rect x="30" y="290" width="290" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="175" y="312" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">POSTGRES + POSTGIS</text>
  <text x="175" y="338" fill="#8b949e" font-size="11" text-anchor="middle">detections (plate,ts) (cam,ts) indexes</text>
  <text x="175" y="358" fill="#8b949e" font-size="11" text-anchor="middle">cameras · edges · edge_time_stats</text>
  <text x="175" y="378" fill="#8b949e" font-size="11" text-anchor="middle">trajectories · hops (evidence JSONB)</text>
  <text x="175" y="398" fill="#8b949e" font-size="11" text-anchor="middle">alerts · blacklist</text>

  <!-- Alerts -->
  <rect x="380" y="290" width="240" height="120" rx="10" fill="#161b22" stroke="#f85149"/>
  <text x="500" y="312" fill="#f85149" font-size="13" font-weight="700" text-anchor="middle">ALERT ENGINE</text>
  <text x="500" y="336" fill="#8b949e" font-size="11" text-anchor="middle">blacklist (exact + fuzzy)</text>
  <text x="500" y="356" fill="#8b949e" font-size="11" text-anchor="middle">hard: impossible traversal</text>
  <text x="500" y="376" fill="#8b949e" font-size="11" text-anchor="middle">soft: per-plate pattern outlier</text>
  <text x="500" y="396" fill="#8b949e" font-size="11" text-anchor="middle">convoy co-location</text>

  <!-- Dashboard -->
  <rect x="680" y="290" width="270" height="120" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="815" y="312" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">GIS DASHBOARD</text>
  <text x="815" y="336" fill="#8b949e" font-size="11" text-anchor="middle">Leaflet map · 18 cameras · heatmap</text>
  <text x="815" y="356" fill="#8b949e" font-size="11" text-anchor="middle">trajectory + hover-for-evidence</text>
  <text x="815" y="376" fill="#8b949e" font-size="11" text-anchor="middle">rollup confidence (min-weighted)</text>
  <text x="815" y="396" fill="#8b949e" font-size="11" text-anchor="middle">PDF case-file export</text>

  <!-- arrows -->
  <line x1="230" y1="165" x2="298" y2="165" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="165" x2="568" y2="165" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="760" y1="270" x2="500" y2="288" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="175" y1="240" x2="175" y2="288" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="350" x2="320" y2="350" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="350" x2="678" y2="350" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="815" y1="270" x2="815" y2="288" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="490" y="460" fill="#8b949e" font-size="11" text-anchor="middle">Every match/alert carries machine-readable evidence: tier · edit distance · travel-time percentile · cosine · rule that fired</text>
  <text x="490" y="480" fill="#8b949e" font-size="11" text-anchor="middle">— no opaque end-to-end scores. Camera network + history are simulated (see NOTES.md).</text>
</svg>
