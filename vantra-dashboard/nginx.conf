server {
    listen 80;

    # dashboard static build
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API + images proxied to the api service
    location /api/ {
        proxy_pass http://api:8712;
        proxy_set_header Host $host;
    }
    location /images/ {
        proxy_pass http://api:8712;
        proxy_set_header Host $host;
    }
}
